<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-labelledby="hdrTitle">
  <title id="hdrTitle">Santhosh Kumar R — Medical Bioinformatics, Structural and Genomic Data Science</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1D26"/>
      <stop offset="55%" stop-color="#0F6E64"/>
      <stop offset="100%" stop-color="#17A398"/>
    </linearGradient>

    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1D26" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B1D26" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Wave-shaped mask: gradient fills the plate, everything below the wave is transparent -->
    <clipPath id="wave">
      <path d="M0,0 H1200 V148
               C1100,178 1000,118 900,148
               C800,178 700,118 600,148
               C500,178 400,118 300,148
               C200,178 100,118 0,148 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#wave)">
    <rect width="1200" height="200" fill="url(#bg)"/>
    <rect width="1200" height="200" fill="url(#shade)"/>
  </g>

  <g text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" fill="#E8FFFB">
    <text x="600" y="82" font-size="46" font-weight="700" letter-spacing="0.5" opacity="0">
      Santhosh Kumar R
      <animate attributeName="opacity" from="0" to="1" begin="0s" dur="1.1s" fill="freeze"/>
    </text>
    <text x="600" y="116" font-size="17" font-weight="600" letter-spacing="0.4" opacity="0">
      Medical Bioinformatics &#160;|&#160; Structural &amp; Genomic Data Science
      <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="1.1s" fill="freeze"/>
    </text>
  </g>
</svg>
